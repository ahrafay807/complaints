<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoodWe Pakistan — Complaints</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23ffffff'/><text x='16' y='23' font-family='Arial' font-weight='700' font-size='20' fill='%23E2231A' text-anchor='middle'>W</text></svg>">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0A0A0A; }
  iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

  #fallback {
    display: none;
    position: fixed; inset: 0;
    background: #0A0A0A;
    color: #F2F2F2;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  #fallback h1 { font-size: 18px; margin: 0 0 10px 0; }
  #fallback p { font-size: 14px; color: #9A9A9A; margin: 0 0 24px 0; max-width: 380px; }
  #fallback a {
    display: inline-block;
    background: #E2231A;
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 28px;
    border-radius: 8px;
  }
</style>
</head>
<body>

<iframe id="app-frame" title="GoodWe Pakistan Complaint Portal" allow="clipboard-write"></iframe>

<div id="fallback">
  <h1>GoodWe Pakistan — Complaint Portal</h1>
  <p>The portal couldn't load inside this page. Open it directly instead; everything works the same way.</p>
  <a id="fallback-link" target="_top">Open Complaint Portal</a>
</div>

<script>
  // ⬇ Paste the Complaint portal's Web app URL (ends in /exec) between the quotes.
  var APP_URL = 'PASTE_COMPLAINTS_EXEC_URL_HERE';

  var frame = document.getElementById('app-frame');
  document.getElementById('fallback-link').href = APP_URL;
  frame.src = APP_URL;

  // If the portal hasn't loaded after 8 seconds (framing blocked, network issue),
  // show a direct link instead of a blank page.
  var loaded = false;
  frame.addEventListener('load', function () { loaded = true; });
  setTimeout(function () {
    if (!loaded) document.getElementById('fallback').style.display = 'flex';
  }, 8000);
</script>

</body>
</html>
